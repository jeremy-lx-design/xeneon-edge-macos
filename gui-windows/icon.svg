<!--
  Source artwork for XeneonUI.ico. Regenerate the .ico after editing:
      make icon
  Rays are deliberately chunky so they survive the 16x16 downscale.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323a46"/>
      <stop offset="1" stop-color="#161a20"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- brightness sun -->
  <g fill="url(#sun)">
    <circle cx="128" cy="100" r="38"/>
    <g>
      <rect x="119" y="14" width="18" height="30" rx="9"/>
      <rect x="119" y="14" width="18" height="30" rx="9" transform="rotate(45 128 100)"/>
      <rect x="119" y="14" width="18" height="30" rx="9" transform="rotate(90 128 100)"/>
      <rect x="119" y="14" width="18" height="30" rx="9" transform="rotate(135 128 100)"/>
      <rect x="119" y="14" width="18" height="30" rx="9" transform="rotate(180 128 100)"/>
      <rect x="119" y="14" width="18" height="30" rx="9" transform="rotate(225 128 100)"/>
      <rect x="119" y="14" width="18" height="30" rx="9" transform="rotate(270 128 100)"/>
      <rect x="119" y="14" width="18" height="30" rx="9" transform="rotate(315 128 100)"/>
    </g>
  </g>

  <!-- ultrawide display -->
  <rect x="34" y="184" width="188" height="48" rx="10" fill="#e8edf4"/>
  <rect x="44" y="194" width="168" height="28" rx="5" fill="#0f1319"/>
</svg>
